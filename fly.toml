# fly.toml app configuration file generated for Flight-Price-Tracker
app = "flight-price-tracker"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/config/flights.db"
  TZ = "Asia/Kolkata"
  CURRENCY = "INR"
  POLL_INTERVAL_MINUTES = "60"

[mounts]
  source = "flight_data"
  destination = "/config"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
